name: Build DBX review candidates

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  candidates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./manifest.json").version')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go -C backend test -race ./...
      - run: go -C backend vet ./...
      - run: npm install --global @dbx-app/plugin-cli@0.1.9
      - run: npm run package:all
      - name: Verify native package protocol
        run: |
          arch=$(node -p 'process.arch === "arm64" ? "arm64" : "x64"')
          id=$(node -p 'require("./manifest.json").id')
          version=$(node -p 'require("./manifest.json").version')
          go run scripts/verify-package.go "dist/${id}-${version}-darwin-${arch}.dbxp" --handshake
      - name: Upload unsigned candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.dbxp dist/*.artifact.json dist/SHA256SUMS-*.txt dist/release-candidates.json
